[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "church-horror"
version = "0.1.0"
description = "A low-poly 90s-inspired horror church exploration in Pygame and OpenGL"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6,<3",
    "PyOpenGL>=3.1.7,<4",
]

[project.scripts]
church-horror = "church_horror.app:main"

[tool.setuptools.packages.find]
where = ["src"]
